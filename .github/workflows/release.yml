name: Build
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - uses: actions/upload-artifact@v4
        with:
          name: group-generator
          path: |
            src/index.html
            src/groups.js

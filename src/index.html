<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Generator</title>
<link rel="stylesheet" href="style.css">
<script src="storage.js"></script>
<script>
  // Apply the theme before first paint to avoid a flash.
  const storage = GroupStorage.createStorage(localStorage);
  document.documentElement.dataset.theme =
    storage.theme.load() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
</head>
<body>
<main>
  <header>
    <h1>Group Generator</h1>
    <div class="bar">
      <button id="theme" aria-label="Switch to dark theme" title="Toggle light/dark theme">🌙</button>
      <button id="demo" title="Fill in sample data and generate groups">✨ Demo</button>
    </div>
  </header>

  <section class="card" aria-label="Saved classes">
    <h2>Classes</h2>
    <div class="bar">
      <label class="field">Class name <input id="className" placeholder="e.g. Year 9 Maths"></label>
      <button id="save" style="align-self:flex-end">💾 Save</button>
      <label class="field">Saved classes <select id="saved"></select></label>
      <button id="load" style="align-self:flex-end">Load</button>
      <button id="delete" style="align-self:flex-end">Delete</button>
    </div>
    <p class="hint" id="status" role="status"></p>
  </section>

  <section class="card" aria-label="Names">
    <div class="bar between">
      <h2>Names <span id="count-people" class="hint"></span></h2>
      <div class="seg" role="group" aria-label="Name entry view">
        <button id="viewList" aria-pressed="true">List</button>
        <button id="viewGrid" aria-pressed="false">Grid</button>
      </div>
    </div>
    <div id="listView">
      <textarea id="names" aria-label="Names" placeholder="Last, First, Gender&#10;Lee, Ann, F&#10;Ray, Bob, M"></textarea>
      <p class="hint">One person per line: <b>Last, First, Gender</b>. Gender is optional. Pasting from Excel works.</p>
    </div>
    <div id="gridView" hidden>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Last name</th><th>First name</th><th>Gender</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="bar" style="margin-top:.5rem"><button id="addRow">+ Add row</button></div>
      <p class="hint">Paste columns copied from Excel into any cell to fill rows from there down.</p>
    </div>
  </section>

  <div class="cols">
    <section class="card" aria-label="Separate people">
      <h2>Keep apart</h2>
      <div class="bar">
        <select id="pairA" aria-label="First person"></select>
        <span>+</span>
        <select id="pairB" aria-label="Second person"></select>
        <button id="addPair">Add</button>
      </div>
      <div class="chips" id="pairs"></div>
      <p class="hint">These people won't be placed in the same group.</p>
    </section>

    <section class="card" aria-label="Options">
      <h2>Options</h2>
      <div class="bar">
        <div class="field"><label for="count">Number of groups</label><span class="stepper"><button type="button" id="countDown" aria-label="Fewer groups">−</button><input id="count" type="number" inputmode="numeric" pattern="[0-9]*" min="1" value="2"><button type="button" id="countUp" aria-label="More groups">+</button></span></div>
        <label style="align-self:flex-end"><input id="mix" type="checkbox"> Evenly mix genders</label>
      </div>
      <p class="bar" style="margin-top:1rem"><button id="go" class="primary">Generate groups</button></p>
    </section>
  </div>

  <p id="error" class="error" role="alert"></p>
  <div id="groups" aria-live="polite"></div>
</main>
<script src="groups.js"></script>
<script src="app.js"></script>
</body>
</html>
